; PlatformIO projesi
; 2x Deneyap Kumanda Kolu (analog joystick) -> ESP32-S3 -> USB Seri
;
; Derle:   pio run                 (veya VS Code PlatformIO: "Build" ✓)
; Yukle:   pio run -t upload       (veya "Upload" ->)
; Monitor: pio device monitor      (115200)  -- ama oyun/serial_test ile cakismasin
;
; Kullanim notu: Bu klasoru (firmware/) PlatformIO projesi olarak ac
; (VS Code: File > Open Folder > firmware), ya da komut satirindan
; "pio run -d firmware" seklinde calistir.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Serial, UART0 -> CH343 USB-seri kopru cipi -> PC'deki COM portu uzerinden aksin.
; (Kart CH343'lu USB-C portundan takili: COM11.)
; CDC_ON_BOOT=0 -> Serial = UART0 (CH343). 1 yapsaydik Serial native USB portuna
; giderdi ve CH343 portunda (COM11) hic veri gorunmezdi.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
